{% extends 'layout.html' %}

{% block css %}
    <link rel="stylesheet" href="/static/templates/post.css">
{% endblock %}

{% block body %}
    <main>
        <div class="post">
            <h1 class="post_title">{{post["title"]}}</h1>
            <img src="/{{post['imgsrc']}}" class="postimg">
            <p class="post_body">{{post["body"]}}</p>
            <p class="post_datetime">{{post["datetime"]}}</p>
            {% if session.user_id %}
            <form action="/posts/{{post['id']}}/delete" method="post" style="text-align: center; margin: 2rem 0;">
                <button type="submit" onclick="return confirm('Are you sure you want to delete this post?');" style="background-color: #ff4d4d; color: white; border: 2px solid black; padding: 0.6rem 1.2rem; font-size: 1rem; font-weight: bold; cursor: pointer;">🗑️ Delete Post</button>
            </form>
            {% endif %}
        </div>
    </main>
{% endblock %}
