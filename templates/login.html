{% extends 'layout.html' %}

{% block body %}
    <main style="padding: 2rem; max-width: 400px; margin: 0 auto;">
        <h2>Poweruser Login</h2>
        <form method="post" action="/login">
            <div style="margin-bottom: 1rem;">
                <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 0.5rem;" />
            </div>
            <div style="margin-bottom: 1rem;">
                <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 0.5rem;" />
            </div>
            <button type="submit" style="padding: 0.5rem 1rem;">Log In</button>
        </form>
    </main>
{% endblock %}
